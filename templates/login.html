<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HEXER — Sign in</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="brand">HEXER</div>
<main class="card">
  <h1>Sign in to HEXER</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST" action="/login">
    <label>Email or mobile number</label>
    <input
        type="text"
        name="email"
        autocomplete="username"
        required
    >

    <button type="submit">Continue</button>
</form>

<a href="/forgot-password">Forgot password?</a>
  <p class="note">Demo interface: no passwords are collected or stored.</p>
</main>
<footer>Help · Contact · Privacy · Terms · Security<br>© 2026 HEXER. All rights reserved.</footer>
</body>
</html>

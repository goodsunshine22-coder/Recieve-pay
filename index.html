<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paypal — Sign In</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #f7fbff 0%, #eaf4ff 100%);
      color: #102a43;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand {
      margin-top: 54px;
      margin-bottom: 28px;
      font-size: 31px;
      font-weight: 800;
      letter-spacing: 2px;
      color: black;
    }

    .card {
      width: min(420px, calc(100% - 32px));
      padding: 34px;
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 18px;
      box-shadow: 0 18px 55px rgba(15, 78, 125, .14);
      backdrop-filter: blur(16px);
    }

    h1 {
      margin: 0 0 26px;
      text-align: center;
      font-size: 25px;
      font-weight: 650;
    }

    label {
      display: block;
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 50px;
      padding: 0 14px;
      border: 1px solid #b8c8d8;
      border-radius: 8px;
      outline: none;
      font-size: 16px;
      transition: .2s ease;
      background: rgba(255,255,255,.92);
    }

    input:focus {
      border-color: #0874d9;
      box-shadow: 0 0 0 3px rgba(8,116,217,.12);
    }

    .password-row {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .forgot {
      color: #086bc7;
      font-size: 14px;
      text-decoration: none;
      font-weight: 600;
    }

    .forgot:hover { text-decoration: underline; }

    button {
      width: 100%;
      height: 50px;
      margin-top: 27px;
      border: 0;
      border-radius: 25px;
      background: #0874d9;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(8,116,217,.22);
      transition: .2s ease;
    }

    button:hover {
      background: #075eaf;
      transform: translateY(-1px);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 25px 0;
      color: #718096;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #d8e2ec;
    }

    .signup {
      width: 100%;
      height: 48px;
      margin-top: 0;
      background: white;
      color: #0874d9;
      border: 1px solid #0874d9;
      box-shadow: none;
    }

    .signup:hover {
      background: #f2f8ff;
      color: #075eaf;
    }

    .footer {
      margin-top: 30px;
      padding: 0 20px 28px;
      text-align: center;
      color: #637589;
      font-size: 12px;
      line-height: 1.8;
    }

    .footer a {
      color: #637589;
      text-decoration: none;
      margin: 0 7px;
    }

    .footer a:hover {
      color: #0874d9;
      text-decoration: underline;
    }

    .demo-note {
      margin-top: 16px;
      text-align: center;
      font-size: 11px;
      color: #8293a6;
    }

    @media (max-width: 480px) {
      .brand { margin-top: 34px; }
      .card { padding: 27px 22px; }
    }
  </style>
</head>
<body>

  <div class="brand">PayPal</div>

  <main class="card">
    <h1>Sign in to PayPal</h1>

    <form onsubmit="return false;">
      <label for="email">Email or mobile number</label>
      <input
        id="email"
        type="text"
        autocomplete="username"
        placeholder="Enter your email or mobile number"
      >

      <div class="password-row">
        <label for="password" style="margin:0;">Password</label>
        <a class="forgot" href="#">Forgot password?</a>
      </div>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter your password"
      >

      <button type="submit">Log In</button>

      <div class="divider">or</div>

      <button class="signup" type="button">Create an account</button>
    </form>

    <div class="demo-note">paypal | login</div>
  </main>

  <footer class="footer">
    <div>
      <a href="#">Help</a>
      <a href="#">Contact</a>
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Security</a>
    </div>
    <div>© 2026 HEXER. All rights reserved.</div>
  </footer>

</body>
</html>
